[project]
name = "arc-apache-binary-memory"
version = "0.5.0"
description = "Binary-first cryptographic memory substrate for ARC systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "GareBear99 / ARC ecosystem"}]
license = {text = "MIT"}
keywords = ["binary-memory", "merkle", "cryptographic-receipts", "arc", "provenance", "llm-lineage"]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]
test = ["pytest>=8", "cryptography>=42"]

[project.scripts]
arc-apache = "arc_apache.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
